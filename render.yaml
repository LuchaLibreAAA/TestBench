services:
  - type: web
    name: testbench-web
    runtime: static
    rootDir: testbench
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: testbench-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DB_PATH
        value: backend/data/app.db
      - key: ASSETS_DIR
        value: backend/data/assets
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOW_INSECURE_DEV
        value: "0"
      - key: CORS_ORIGINS
        value: https://testbench-web.onrender.com,http://localhost:5173
